name: Release Gate (SHIP / BLOCK)

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  release-gate:
    name: Release Gate — Performance Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate latest candidate vs baseline
        env:
          BASE_URL: ${{ secrets.GATE_BASE_URL }}
        run: |
          set -euo pipefail

          URL="${BASE_URL%/}/api/releases/latest?suite_id=1&dataset_id=1&backend=mujoco"
          echo "Calling: $URL"

          RESP="$(curl -fsSL "$URL")"
          DECISION="$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('decision',''))")"

          echo "Decision: $DECISION"

          if [ "$DECISION" = "BLOCK" ]; then
            echo "❌ RELEASE BLOCKED — performance regression detected"
            exit 1
          fi

          echo "✅ RELEASE APPROVED — SHIP"
